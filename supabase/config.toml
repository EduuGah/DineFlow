project_id = "dineflow"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
# O schema `app` fica fora da API de proposito: as funcoes de resolucao de
# tenant e a maquina de estados sao internas ao banco, nao endpoints.
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

# Caixa de e-mail local (antigo [inbucket]): captura os e-mails de confirmacao
# e recuperacao de senha em desenvolvimento, sem enviar nada de verdade.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

# O DineFlow entra apenas pelo Google. Manter o cadastro por e-mail/senha
# ligado deixaria uma porta de entrada que a aplicacao nao usa nem protege.
[auth.email]
enable_signup = false
enable_confirmations = false

[auth.external.google]
enabled = true
# Preencha no .env do Supabase local (supabase/.env):
#   GOOGLE_CLIENT_ID / GOOGLE_SECRET
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"
skip_nonce_check = false

[auth.rate_limit]
# Protecao contra forca bruta (secao 24 do roadmap).
email_sent = 10
sign_in_sign_ups = 30
token_refresh = 150

[analytics]
enabled = false
